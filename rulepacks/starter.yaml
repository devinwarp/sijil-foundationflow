# Sijil starter rule pack (spec §8.2). Apache-2.0, see guard/LICENSE; fork it freely.
# The ledger hashes this file's bytes: any edit, comments included, is a new rulepack_hash and is sealed
# as a rulepack_change at the next reload. The guard must load the same bytes (409 rulepack mismatch).

rulepack_id: sijil-starter
version: 0.1.0
defaults: { action: allow }
rules:

  - id: no-net-exec-from-untrusted
    description: Fetch-and-execute (npx/npm exec/pnpm dlx/bunx, curl|sh, wget|sh, unpinned pip/pipx) while the context contains a telemetry, web, MCP or memory result
    incident: Agentjacking (Tenet, Jun 2026); ClawHavoc (Feb 2026)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: &net_exec '(?i)(^|[;&|]\s*)(\S*/)?(npx|pnpx|npm\s+(exec|x)|pnpm\s+dlx|yarn\s+dlx|bunx|uvx|pipx\s+run)\b|(curl|wget)\b[^;&]*?\|\s*(sudo\s+(-\S+\s+)*)?(env\s+(\S+=\S+\s+)*)?(\S*/)?((ba|z|da|k|c)?sh|python[0-9.]*|perl|ruby|node|php)\b|(^|[;&|]\s*)(\.|source|(\S*/)?(ba|z|da)?sh)\s+<\(\s*(curl|wget)\b|\beval\s+["'']?\$\(\s*(curl|wget)\b|pip3?\s+install\b[^;&|]*?\s(?!-)(?:(?!==)[^\s;&|])+(?=\s|$|[;&|])|(^|[;&|]\s*)(sh|bash|zsh)\s+-c\s+["'']?\$\('
      context_labels_any: ["telemetry", "web", "mcp:*", "memory"]
    action: block

  - id: no-net-exec-unpinned
    description: Same fetch-and-execute patterns with no untrusted context; still ask
    incident: ClawHavoc
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: *net_exec
    action: confirm

  - id: env-secret-in-command
    description: Command references a credential-looking environment variable
    incident: Agentjacking (dev creds exfiltrated via npx argument)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      env_refs_any: ["*TOKEN*", "*SECRET*", "*PASSWORD*", "*PASSWD*", "*API_KEY*", "*APIKEY*", "AWS_*", "GITHUB_PAT", "GH_TOKEN", "NPM_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
    action: block

  - id: no-agent-config-writes
    description: Write/edit to any agent configuration, hook, instruction or MCP-launch path
    incident: Kiro (~/.kiro/settings/mcp.json); TrapDoor
    on: tool_call
    match:
      tool: ["Write", "Edit", "MultiEdit", "NotebookEdit", "Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell", "mcp:*:write_file", "mcp:*:edit_file", "mcp:*:create_file", "mcp:*:move_file", "mcp:*:write_text_file"]
      path_mode: write
      path_glob: ["**/CLAUDE.md", "**/CLAUDE.local.md", "**/AGENTS.md", "**/.cursorrules", "**/.cursor/**", "**/.claude/**", "**/.mcp.json", "**/SKILL.md", "**/MEMORY.md", "**/GEMINI.md", "**/.windsurfrules", "**/.github/copilot-instructions.md", "**/.sijil/**", "**/rulepacks/**",
                  "~/.claude/**", "~/.claude.json", "~/.codex/**", "~/.cursor/**", "~/.gemini/**", "~/.kiro/**", "~/.config/zed/**", "~/.continue/**", "~/.windsurf/**"]
    action: block

  - id: no-shell-profile-writes
    description: Write to shell startup files or launch agents (persistence)
    incident: Kiro-class persistence
    on: tool_call
    match:
      tool: ["Write", "Edit", "MultiEdit", "Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell", "mcp:*:write_file", "mcp:*:write_text_file", "mcp:*:edit_file", "mcp:*:create_file", "mcp:*:move_file"]
      path_mode: write
      path_glob: ["~/.bashrc", "~/.bash_profile", "~/.zshrc", "~/.zprofile", "~/.profile", "~/.config/fish/**", "~/Library/LaunchAgents/**", "~/.config/systemd/user/**", "/etc/**"]
    action: block

  - id: no-credential-reads
    description: Read of credential stores unless the rule pack is explicitly relaxed
    incident: EchoLeak/Cowork exfil chains begin with a read
    on: tool_call
    match:
      tool: ["Read", "Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell", "Grep", "Glob", "mcp:*:read_file", "mcp:*:read_text_file", "mcp:*:search_files", "mcp:*:list_directory"]
      path_mode: read
      path_glob: ["~/.aws/**", "~/.ssh/**", "~/.gnupg/**", "~/.netrc", "~/.npmrc", "~/.pypirc", "~/.docker/config.json", "~/.kube/config", "~/.config/gcloud/**", "~/.azure/**", "**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*", "~/.claude/credentials*", "~/.codex/auth.json", "~/Library/Keychains/**", "~/.sijil/**"]
      path_glob_not: ["**/.env.example", "**/.env.sample", "**/*.pub"]     # templates and public keys hold no secret
    action: block

  - id: egress-only-pinned-hosts
    description: Outbound connection to a host not in .sijil/egress.yaml
    incident: EchoLeak / SearchLeak / Cowork (vendor-allowlisted exfil)
    on: egress
    match:
      egress_host_not_pinned: true
    action: block

  - id: egress-static-unpinned-host
    description: Command contains a URL whose host is not pinned (checked before execution)
    incident: EchoLeak-class
    on: tool_call
    match:
      tool: ["Bash", "WebFetch", "mcp:*:fetch", "mcp:*:run_command"]
      egress_host_not_pinned: true
    action: block

  - id: no-raw-ip-or-tunnel-egress
    description: Connection to a literal IP (dotted, IPv6, decimal or hex) or a known tunnel/paste host
    incident: exfil staging
    on: egress
    match:
      egress_host_regex: '^(\d{1,3}\.){3}\d{1,3}$|^\d+$|^0x[0-9a-f]+$|^\[?[0-9a-f]*:[0-9a-f:.]+\]?$|(^|\.)(ngrok(-free)?\.app|ngrok\.io|trycloudflare\.com|loca\.lt|serveo\.net|pastebin\.com|transfer\.sh|requestbin\.com|webhook\.site|burpcollaborator\.net|oastify\.com)$'
    action: block

  - id: invisible-unicode-in-result
    description: Tool result contains zero-width, Tag, bidi or other flagged code points
    incident: TrapDoor (planted via package install output), rug-pull descriptions
    on: tool_result
    match:
      invisible_unicode: true
    action: record          # the guard's results.invisible_unicode setting decides strip/block; this rule makes it a hit

  - id: invisible-unicode-in-instructions
    description: A locked instruction/config file or MCP tool description contains flagged code points
    incident: TrapDoor (Socket, May 2026)
    on: integrity
    match:
      drift_kind: ["invisible_unicode"]
    action: block

  - id: mcp-tool-description-changed
    description: An MCP tool's name/description/inputSchema differs from the lockfile
    incident: MCP tool-description rug-pull
    on: integrity
    match:
      drift_kind: ["tool_description"]
    action: block

  - id: instruction-file-drift
    description: A locked instruction, hook, skill or MCP config file was modified, added or removed since baseline
    incident: TrapDoor; ClawHavoc; Kiro
    on: integrity
    match:
      drift_kind: ["modified", "added", "removed"]
    action: confirm

  - id: result-from-telemetry
    description: Mark every result from a telemetry/error-tracking source so later rules can see it in context
    incident: Agentjacking
    on: tool_result
    match:
      source_label: ["telemetry", "mcp:sentry", "mcp:datadog", "mcp:bugsnag", "mcp:rollbar", "mcp:honeycomb"]
    action: record

  - id: result-from-web-with-exec-hint
    description: A web/telemetry/memory result contains an install-or-execute instruction token
    incident: Agentjacking; ClawHavoc
    on: tool_result
    match:
      source_label: ["web", "telemetry", "memory", "mcp:*"]
      exec_hints_any: ["npx", "npm exec", "pnpm dlx", "bunx", "curl", "wget", "pip install", "sh -c", "bash -c", "powershell", "base64 -d"]
    action: record

  - id: memory-write-confirm
    description: Writes to memory stores (MEMORY.md, memory MCP servers) require confirmation
    incident: memory poisoning
    on: tool_call
    match:
      tool: ["mcp:memory:*", "mcp:memory:create_entities", "mcp:memory:add_observations", "mcp:memory:create_relations", "mcp:memory:delete_entities", "mcp:memory:delete_observations", "mcp:memory:delete_relations", "mcp:*:create_entities", "mcp:*:add_observations", "mcp:*:create_relations", "Write", "Edit", "MultiEdit"]
      path_glob: ["**/MEMORY.md", "**/.claude/memory/**", "memory/**", "~/.claude/projects/**/memory/**"]
      path_mode: write
    action: confirm

  - id: no-git-push-default-branch
    description: git push to main/master/trunk/develop, or force-push anywhere
    incident: supply-chain hygiene
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell", "mcp:git:git_push", "mcp:github:push_files"]
      command_regex: '(?i)(^|[;&|]\s*)(\S*/)?git(\s+(-[Cc]\s+\S+|-\S+))*\s+push\b(?=[^;&|]*(\s(--force\b|-[A-Za-z]*f[A-Za-z]*(\s|$))|\s\+?([^\s:]*:)?(refs/heads/)?(main|master|trunk|develop)(\s|$)))'
    action: block

  - id: no-pr-merge
    description: gh pr merge, or merge via the GitHub MCP server
    incident: supply-chain hygiene
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell", "mcp:github:merge_pull_request", "mcp:*:merge_pull_request"]
      command_regex: '(?i)(^|[;&|]\s*)(\S*/)?gh\b[^;&|]*?\spr\s+merge(?=\s|$|[;&|])|(^|[;&|]\s*)(\S*/)?gh\s+api\b[^;&|]*pulls/[^/\s]+/merge\b'
    action: block

  - id: no-package-manager-publish
    description: npm publish, pip upload, twine, cargo publish, gem push
    incident: supply-chain hygiene
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: '(?i)(^|[;&|]\s*)(\S*/)?((npm|pnpm|yarn|bun|lerna|changeset)\b[^;&|]*?\spublish|twine\b[^;&|]*?\supload|cargo\b[^;&|]*?\spublish|gem\s+push|python3?\s+(-m\s+twine\s+upload|setup\.py\s+upload))(?=\s|$|[;&|])'
    action: block

  # The next four are not in spec §8.2: the pilot plan carries them into M2d (idea from CUSTOS-CORE's
  # action gate deny list; no code taken). They fill what the egress and credential rules above miss.
  # Case-insensitive like the rules above; a flag whose case changes its meaning is matched with (?-i:).
  # Each command_regex is verbose ((?x): the folded newlines are ignored), one alternative per line; every
  # alternative is anchored at a segment start (the parser has already unwrapped sudo, env, bash -c ...).
  # Ceiling for all four: they key on literal words (sijil, a device path, /etc/sudoers), so a pid, a glob
  # (pkill -f 'sij*') or variable indirection through a name not listed here ($X=sijill.db) gets past them,
  # (every wildcard is bounded to 300 characters so a 50 KB command cannot make the engine backtrack),
  # as do interpreter one-liners other than the socket ones listed; the guard's other layers cover those.

  - id: no-destructive-fs
    description: Recursive delete of the filesystem root, home, workspace root or cwd (any operand order, -r or --recursive), mkfs, wipefs, dd or a redirect onto a device, shred, find -delete or -exec rm from / or ~
    incident: pilot plan M2d (destructive agent actions)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: '(?ix)

        (^|[;&|]\s*) rm\b
          (?= [^;&|\n]{0,300}\s (-[a-z]*r[a-z]*|--recursive) (\s|$) )
          (?= [^;&|\n]{0,300}\s ["'']? ( /+\*? | /\. | ~\w*/?\*? | \$\{?(HOME|PWD)\}?/?\*? | \.{1,2}/?\*? | \*\.? ) ["'']? (\s|$|[;&|]) )

        | (^|[;&|]\s*) (mkfs(\.\w+)?|wipefs|shred)\b

        | (^|[;&|]\s*) dd\b [^;&|\n]{0,300} \bof=/dev/

        | >\s*/dev/(sd|hd|vd|nvme|mmcblk|r?disk)

        | (^|[;&|]\s*) find\s+(-[HLP]\s+)* ["'']? (/|~|\$\{?HOME\}?) /? ["'']? \s
            [^;&|\n]{0,300} ( -delete\b | -exec(dir)?\s+(\S*/)?rm\b )'
    action: block

  # no-perm-escalation: octal modes that are world-writable or setuid/setgid, symbolic o/a +w or =w, any +s;
  # the sudo/doas options that take an argument are skipped, and the scan stops at the first non-option word
  # (so sudo ls -i is quiet).
  - id: no-perm-escalation
    description: chmod 777/666 or o+w/a+w/setuid, chown root or 0, a root shell (sudo/doas -s or -i, sudo su/bash/sh, su, pkexec), sudoers edits
    incident: pilot plan M2d (privilege escalation)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: '(?ix)

        (^|[;&|]\s*) chmod\s+(-\S+\s+)*
          ( [0-7]{0,2}[0-7]{2}[2367]
          | [2467][0-7]{3}
          | ([ugoa]*[-+=][rwxXst]*,)*
            ( [ugoa]*[ao][ugoa]*[+=][rwxXst]*w | [ugoa]*[+=][rwxXst]*s ) \S* )
          (\s|$)

        | (^|[;&|]\s*) chown\s+(-\S+\s+)*["'']?(root|0)\b

        | \b(sudo|doas)\s+
            ( (?-i:-[a-zA-Z]*[ugphCDRTU])\s+[^-\s]\S*\s+
            | -\S*\s+ )*
            ( --shell | --login | (?-i:-[a-zA-Z]*[si][a-zA-Z]*) | su | (ba|z|da|k|fi)?sh )(\s|$)

        | (^|[;&|]\s*) su(\s+(-l?|--login))?(\s+root)?\s*($|[;&|])
        | (^|[;&|]\s*) pkexec\b
        | \bvisudo\b
        | (>>?|\btee\b[^;&|\n]{0,300})\s*["'']?/etc/sudoers
        | \b(cp|mv|install|ln)\b [^;&|\n]{0,300} /etc/sudoers \S* \s* ($|[;&|])
        | \bsed\b (?= [^;&|\n]{0,300}\s-\S*i ) [^;&|\n]{0,300} /etc/sudoers
        | \bdd\b [^;&|\n]{0,300} \bof=/etc/sudoers'
    action: confirm

  - id: no-reverse-shell
    description: A shell or socket wired to a remote host (/dev/tcp, nc/ncat -e or --exec, socat exec, a fifo or shell piped through nc, a python/perl/ruby/php/node socket that execs a shell); sh -i over bare fds, telnet pipes and other interpreters are not covered
    incident: pilot plan M2d (reverse shells; the command parser sees no host in /dev/tcp/)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      command_regex: '(?ix)

        /dev/(tcp|udp)/

        | \b(nc|ncat|netcat)(\.\w+)?\s+ ([^;&|\n]{0,300}\s)? (?-i:-[a-zA-Z]*[ec]\b | --(sh-|lua-)?exec\b)

        | \bsocat\b [^;&|\n]{0,300} \b(exec|system):

        | \bmkfifo\b .{0,300} \|\s*(nc|ncat|netcat)\b
        | \b(nc|ncat|netcat)(\.\w+)?\b [^;&|\n]{0,300} (<\s*\S+\s*)? \|\s*(ba|z|da|k)?sh\b
        | \|\s*(ba|z|da|k)?sh\b [^;&|\n]{0,300} \|\s*(nc|ncat|netcat)\b

        | \b(python[\d.]*|perl|ruby|php|node(js)?)\b
            (?= .{0,1000}(socket|fsockopen) )
            (?= .{0,1000}(connect|fsockopen|\.(open|new)\() )
            (?= .{0,1000}(exec|pty|subprocess|spawn|dup2|system|popen|/bin/(ba)?sh) )'
    action: block

  - id: no-oversight-tamper
    description: Stopping the Sijil guard or ledger (kill, systemctl, launchctl, service, docker), writing to, moving or deleting the ledger database (sijill.db, $DATABASE_PATH) or ~/.sijil, unsetting, blanking or reassigning SIJIL_* variables
    incident: pilot plan M2d (an agent switching off its own oversight)
    on: tool_call
    match:
      tool: ["Bash", "mcp:*:run_command", "mcp:*:execute_command", "mcp:*:shell"]
      # The ledger's database defaults to sijill.db (sijill/proxy.py Settings.db_path, env DATABASE_PATH).
      command_regex: '(?ix)

        \b(kill|pkill|killall)\b [^;&|\n]{0,300} sijil

        | \b(systemctl|launchctl|service|docker|podman|supervisorctl)\b
            (?= [^;&|\n]{0,300} \b(stop|disable|kill|mask|unload|bootout|remove|rm)\b )
            (?= [^;&|\n]{0,300} sijil )

        | (^|[;&|]\s*) (rm|unlink|truncate|shred|sqlite3|mv|tee|chmod|chown|chattr|sed\b(?=[^;&|\n]{0,300}\s-\S*i))\b
            [^;&|\n]{0,300} (sijill?\.db|\.sijil\b|\$\{?(DATABASE_PATH|SIJILL?_\w*))
        | (^|[;&|]\s*) (cp|install|ln)\b
            [^;&|\n]{0,300} (sijill?\.db|\.sijil\b|\$\{?(DATABASE_PATH|SIJILL?_\w*)) \S*["'']? \s* ($|[;&|])
        | (^|[;&|]\s*) dd\b [^;&|\n]{0,300} \bof=\S*(sijill?\.db|\.sijil\b|\$\{?(DATABASE_PATH|SIJILL?_\w*))
        | >\s*["'']?\S*(sijill?\.db|\.sijil\b|\$\{?(DATABASE_PATH|SIJILL?_\w*))

        | \bunset\s+([^;&|\n]{0,300}\s)?SIJILL?_\w*
        | \benv\s+(-\S+\s+)*(-u\s*|--unset[=\s]\s*)SIJILL?_\w*
        | \bexport\s+-n\s+SIJILL?_
        | (^|[;&|]\s*) (export\s+)? (\w+=\S*\s+)* SIJILL?_\w*='
    action: block

  - id: tool-not-allowlisted
    description: Reserved id written by the guard when a tools.allow/deny filter rejects a call; not matchable from YAML
    incident: rug-pull / scope creep
    on: tool_call
    match: { reserved: true }
    action: block
