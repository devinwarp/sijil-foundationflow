{{- if .Values.agent.enabled }}
{{- $name := printf "%s-agent" (include "sijil.fullname" .) }}
{{- $_ := required "rulepack is required with agent.enabled: the guard cannot run without it" .Values.rulepack }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "sijil.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1          # one agent identity, one session state file: scale by adding agents, not replicas
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agent}
  template:
    metadata:
      labels: {{- include "sijil.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        sijil.io/agent: "true"
      annotations:
        checksum/guard: {{ list (tpl .Values.guard.config .) .Values.guard.files | toJson | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      automountServiceAccountToken: false   # nothing in the pod talks to the Kubernetes API
      securityContext: {{ toJson .Values.podSecurityContext }}
      initContainers:
        # The guard refuses a key it does not own or that others can read; a Secret volume is root-owned.
        - name: agent-key
          image: {{ include "sijil.image" (dict "image" .Values.image.guard "name" "guard") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c, "cp /agent-key/agent.key /state/agent.key && chmod 600 /state/agent.key"]
          securityContext: {{ toJson .Values.securityContext }}
          resources: {{ toJson .Values.guard.resources }}
          volumeMounts:
            - {name: agent-key, mountPath: /agent-key, readOnly: true}
            - {name: guard-state, mountPath: /state}
      containers:
        - name: agent
          image: {{ required "agent.image" .Values.agent.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.agent.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with .Values.agent.args }}
          args: {{ toJson . }}
          {{- end }}
          env:
            - {name: OPENAI_BASE_URL, value: "{{ include "sijil.ledgerUrl" . }}/v1"}
            - {name: SIJIL_ADAPTER_URL, value: "http://127.0.0.1:8090"}
            - name: SIJIL_TOOLS_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "sijil.secretName" . }}, key: tools-token}}
            {{- with .Values.agent.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext: {{ toJson (.Values.agent.securityContext | default .Values.securityContext) }}
          resources: {{ toJson .Values.agent.resources }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        {{- include "sijil.guardContainer" (dict "root" . "name" "sijil-adapter" "args" (list "http") "probe" true) | nindent 8 }}
        {{- range .Values.agent.mcpGuards }}
        {{- include "sijil.guardContainer" (dict "root" $ "name" (printf "sijil-mcp-%s" .server) "args" (list "serve" "--server" .server "--http" (printf "127.0.0.1:%v" .port))) | nindent 8 }}
        {{- end }}
      volumes:
        - name: guard-config
          configMap: {name: {{ include "sijil.fullname" . }}-guard}
        - name: rulepack
          configMap: {name: {{ include "sijil.fullname" . }}-rulepack}
        - name: agent-key
          # 0440: root-owned, readable through the group: GID 0 (no runAsGroup) or fsGroup (OpenShift injects one).
          # If you set runAsGroup to a non-zero GID, set fsGroup too (podSecurityContext).
          secret: {secretName: {{ required "guard.agentKeySecret" .Values.guard.agentKeySecret }}, defaultMode: 0440}
        - name: guard-state
          emptyDir: {medium: Memory}
        - name: tmp
          emptyDir: {}
{{- end }}
