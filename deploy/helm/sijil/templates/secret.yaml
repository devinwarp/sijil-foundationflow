{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sijil.secretName" . }}
  labels: {{- include "sijil.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ required "secrets.values.adminToken, or secrets.existingSecret" $v.adminToken | quote }}
  agent-token: {{ required "secrets.values.agentToken, or secrets.existingSecret" $v.agentToken | quote }}
  tools-token: {{ required "secrets.values.toolsToken, or secrets.existingSecret" $v.toolsToken | quote }}
{{- end }}
