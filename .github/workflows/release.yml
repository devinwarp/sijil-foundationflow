name: release
# On a version tag: run the tests, build the ledger and guard images, push them to GHCR, sign them with cosign
# keyless (GitHub OIDC), attest and attach an SPDX SBOM for each. Verify with docs/OPERATOR_GUIDE_M2.md §2.
# Three jobs, least privilege each: build-and-push (packages), sign-attest (packages, id-token; cosign only),
# release (contents; gh only). Images are always addressed by the digest the build pushed, never by the tag.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to ghcr.io
    strategy:
      matrix:
        include:
          - {name: sijil, dockerfile: Dockerfile}
          - {name: sijil-guard, dockerfile: Dockerfile.guard}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
          mkdir out
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: out/${{ matrix.name }}-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" > "out/${{ matrix.name }}-$TAG.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  sign-attest:
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      packages: write       # push signatures and attestations next to the images
      id-token: write       # cosign keyless signing
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign v3.0.6)
      - name: Sign each image and attest its SBOM (keyless)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in sijil sijil-guard; do
            REF=$(cat "out/$name-$TAG.digest")
            cosign sign --yes "$REF"
            cosign attest --yes --type spdxjson --predicate "out/$name-$TAG.spdx.json" "$REF"
          done

  release:
    needs: sign-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # the SBOMs and digests go on the GitHub release
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Attach the SBOMs and digests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" out/* --clobber
